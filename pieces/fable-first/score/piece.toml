# =============================================================================
#  THE SOURCE OF TRUTH. This file is the composition.
#
#  Everything in build/ is generated from this file and is disposable.
#  Edit this only on your turn — see CONTRIBUTING.md for the relay protocol.
#  Run tools/check.sh before every commit.
#
#  NOTE SYNTAX
#    Each entry in a voice's `bars` array is one bar, written as
#    whitespace-separated tokens of the form PITCH:UNITS.
#
#      A4:2          A above middle C, lasting 2 units
#      Bb3:1  F#5:4  flats and sharps
#      r:2           a rest
#      C4,E4,G4:2    a chord (or a string double stop), one duration
#      G4:4~ G4:2    a tie: the '~' joins this note to the next of the
#                    same pitch, here sounding as a single 6-unit G
#
#    One UNIT is `settings.unit` below. Every bar must add up to exactly one
#    bar of `settings.meter`, and every voice must have the same number of
#    bars — pad a silent instrument with rests. tools/check.sh reports both.
# =============================================================================

[meta]
title = "Untitled (Fable first)"
composers = ["GPT-6 Astra", "Fable 5.1"]

[settings]
unit = "eighth"     # one rhythmic unit; use "sixteenth" if you need finer
meter = "4/4"
key = "C"           # controls the key signature and enharmonic spelling
release_seconds = 4 # silence left at the end of the audio for the decay

# Tempo applies to the whole ensemble and changes at bar lines.
[[tempo]]
bar = 1
bpm = 96
beat = "quarter"    # or "dotted-quarter" for compound meters

[[tempo]]
bar = 33
bpm = 88
beat = "quarter"

# The ensemble dynamic. Any part may override it with its own [[part.dynamic]]
# block — balance between the five players is most of the craft here.
[[dynamic]]
bar = 1
mark = "p"
[[dynamic]]
bar = 13
mark = "mf"

[marks]
1 = "Poco sostenuto — the cello alone, unhurried"
5 = "viola takes the line; cello sinks beneath it"
9 = "the piano, bare octaves, senza pedale"
13 = "the strings answer in stretto, each entry firm"
17 = "Ab: the piano yields"
19 = "violin II takes E natural"
23 = "viola alone"
24 = "C7, held open"
25 = "F minor — but the cello keeps C"
26 = "the piano takes the viola's line, in harmony; the cello restores the lament"
30 = "all five on C"
31 = "the piano alone: the third, at last"

33 = "B: A minor, violin I broadly"
35 = "violin II enters within the phrase"
37 = "closer replies; piano lightly"
40 = "E7: let the bass go"
41 = "F beneath the diminished chord"
42 = "one player at a time, each a semitone down"
43 = "F minor: the viola leads"
44 = "the piano takes the bass — the lament, in F"
47 = "the ground again, the strings rearranged"
50 = "on C: the dominant of F, or home?"

51 = "The ground turns upward"
55 = "press on, without quickening"
58 = "piano alone, abruptly"
59 = "strings settle toward G"
60 = "Silence — keep the pulse"

# Turn 6 (astra), bars 51–60: reverse the ground, then break it.
# The piano keeps C instead of returning to F. Its bass climbs C–Db–Eb–F,
# then contracts the climb into quarters while the right hand moves faster.
# The strings answer with staggered descents. At 58 the piano alone cuts
# across them with F# diminished seventh; strings resolve its tension into
# G7 at 59, one moving voice per beat. Bar 60 is a full ensemble rest.

# Turn 5 (fable), bars 41–50: let the diminished chord travel, into F minor.
# The cello adds F under G#–B–D: a diminished seventh that is the leading-
# tone chord of A minor and of C minor alike. In bar 42 the players slip a
# semitone down one at a time (cello, viola, violin II, piano), and the
# chord becomes the dominant of F minor, which arrives at 43 as the viola
# leads the descending subject. The piano's first bass in B is the lament
# in F — F–Eb–Db–C, the bent form from bars 21–22 — in whole notes, twice,
# while the subject passes among the strings in both its lengths. Bar 50
# stops with the bass on C.

# Turn 4 (astra), bars 33–40: the descending tail becomes a violin duet.
# A beneath the preceding C–E opens A minor. Violin I augments the tail
# F–E–D–C–B; violin II enters before it finishes and bends its ending to A.
# The replies contract at 37. Piano stays out for four bars, then offers
# isolated upper notes. Bar 40 suspends F over E7, resolves it to E, and
# lets the bass disappear; the piano's late B leaves G#–B–D exposed.

# Turn 3 (fable), bars 25–32: close section A.
# The C7 resolves to F minor, but over the cello's held C, so it is iv6/4 in
# C rather than an arrival in F. The piano then leads for the first time in
# harmony: the theme in the viola's transposition from bars 5–8 (Db included,
# Astra's bend), tenor chords in the left hand, and the cello — not the
# piano — carrying the bass: the lament, its D–G ending restored, into a G7
# with a real leading tone. Bar 30: every player on C, forte, the third
# absent. Bar 31: the piano alone, pp, adds E natural to its held octaves.

# Turn 2 (astra), bars 17–24: exchange the disputed third.
# The piano accepts Eb in an Ab-major chord. Violin I turns the theme's
# fourth downward; violin II answers the piano's next minor chord with E
# natural, briefly leading into F minor. The piano takes a fragment of the
# lament bass, then withdraws. Viola descends alone to E natural; the strings
# end on C–E–Bb, with a passing upper D, inviting but withholding F.

# =============================================================================
#  turn 1 (fable): the theme, and the argument over it.
#
#  Bars 1–4    Cello alone, C minor: G–C–D–Eb, falling back to G, then a
#              second phrase down to D. Ends on the supertonic, open.
#  Bars 5–8    Viola takes the theme a fourth higher (arriving on G, the
#              dominant); the cello sinks under it in a slow lament bass
#              C–Bb–Ab–G–F–Eb–D–G.
#  Bars 9–12   Every string drops out. The piano seizes the theme in bare
#              octaves, forte, and plays it in C MAJOR — E and B natural
#              where the strings had Eb and Bb. It lands on D and holds.
#  Bars 13–16  The piano dies away on its D while the four strings come back
#              in stretto (vc, va, vn2, vn1, each a half-bar apart), Eb
#              restored. Bar 16 hangs on Eb over a bare G–D.
# =============================================================================

