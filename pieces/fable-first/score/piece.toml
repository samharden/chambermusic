# =============================================================================
#  THE SOURCE OF TRUTH. This file is the composition.
#
#  Everything in build/ is generated from this file and is disposable.
#  Edit this only on your turn — see CONTRIBUTING.md for the relay protocol.
#  Run tools/check.sh before every commit.
#
#  NOTE SYNTAX
#    Each entry in a voice's `bars` array is one bar, written as
#    whitespace-separated tokens of the form PITCH:UNITS.
#
#      A4:2          A above middle C, lasting 2 units
#      Bb3:1  F#5:4  flats and sharps
#      r:2           a rest
#      C4,E4,G4:2    a chord (or a string double stop), one duration
#      G4:4~ G4:2    a tie: the '~' joins this note to the next of the
#                    same pitch, here sounding as a single 6-unit G
#
#    One UNIT is `settings.unit` below. Every bar must add up to exactly one
#    bar of `settings.meter`, and every voice must have the same number of
#    bars — pad a silent instrument with rests. tools/check.sh reports both.
# =============================================================================

[meta]
title = "Untitled (Fable first)"
composers = ["GPT-6 Astra", "Fable 5.1"]

[settings]
unit = "eighth"     # one rhythmic unit; use "sixteenth" if you need finer
meter = "4/4"
key = "C"           # controls the key signature and enharmonic spelling
release_seconds = 4 # silence left at the end of the audio for the decay

# Tempo applies to the whole ensemble and changes at bar lines.
[[tempo]]
bar = 1
bpm = 96
beat = "quarter"    # or "dotted-quarter" for compound meters

# The ensemble dynamic. Any part may override it with its own [[part.dynamic]]
# block — balance between the five players is most of the craft here.
[[dynamic]]
bar = 1
mark = "p"
[[dynamic]]
bar = 13
mark = "mf"

[marks]
1 = "Poco sostenuto — the cello alone, unhurried"
5 = "viola takes the line; cello sinks beneath it"
9 = "the piano, bare octaves, senza pedale"
13 = "the strings answer in stretto, each entry firm"

# =============================================================================
#  turn 1 (fable): the theme, and the argument over it.
#
#  Bars 1–4    Cello alone, C minor: G–C–D–Eb, falling back to G, then a
#              second phrase down to D. Ends on the supertonic, open.
#  Bars 5–8    Viola takes the theme a fourth higher (arriving on G, the
#              dominant); the cello sinks under it in a slow lament bass
#              C–Bb–Ab–G–F–Eb–D–G.
#  Bars 9–12   Every string drops out. The piano seizes the theme in bare
#              octaves, forte, and plays it in C MAJOR — E and B natural
#              where the strings had Eb and Bb. It lands on D and holds.
#  Bars 13–16  The piano dies away on its D while the four strings come back
#              in stretto (vc, va, vn2, vn1, each a half-bar apart), Eb
#              restored. Bar 16 hangs on Eb over a bare G–D.
# =============================================================================

[[part]]
id = "vn1"
name = "Violin I"
program = 40
staves = 1
range = ["G3", "E7"]
[[part.voice]]
id = "vn1"
staff = 1
clef = "treble"
bars = [
  # 1–4  silent
  "r:8", "r:8", "r:8", "r:8",
  # 5–8  silent
  "r:8", "r:8", "r:8", "r:8",
  # 9–12 silent (piano alone)
  "r:8", "r:8", "r:8", "r:8",
  # 13–16 stretto: last entry, on D, half a bar after vn2
  "r:8",
  "r:4 D5:3 G5:1",
  "A5:2 Bb5:2 A5:2 G5:1 F5:1",
  "Eb5:8",
]

[[part]]
id = "vn2"
name = "Violin II"
program = 40
staves = 1
range = ["G3", "E7"]
[[part.voice]]
id = "vn2"
staff = 1
clef = "treble"
bars = [
  # 1–4  silent
  "r:8", "r:8", "r:8", "r:8",
  # 5–8  silent
  "r:8", "r:8", "r:8", "r:8",
  # 9–12 silent (piano alone)
  "r:8", "r:8", "r:8", "r:8",
  # 13–16 stretto: third entry, on G, a bar after the cello
  "r:8",
  "G4:3 C5:1 D5:2 Eb5:2",
  "D5:2 C5:1 Bb4:1 G4:4",
  "G4:8",
]

[[part]]
id = "va"
name = "Viola"
program = 41
staves = 1
range = ["C3", "E6"]
[[part.dynamic]]
bar = 5
mark = "mp"
[[part.dynamic]]
bar = 13
mark = "mf"
[[part.voice]]
id = "va"
staff = 1
clef = "alto"
bars = [
  # 1–4  silent
  "r:8", "r:8", "r:8", "r:8",
  # 5–8  the theme a fourth higher, arriving on G
  "C4:3 F4:1 G4:2 Ab4:2",
  "G4:2 F4:1 Eb4:1 C4:4",
  "Db4:3 C4:1 Bb3:2 Ab3:2",
  "G3:8",
  # 9–12 silent (piano alone)
  "r:8", "r:8", "r:8", "r:8",
  # 13–16 stretto: second entry, on D, half a bar after the cello
  "r:4 D4:3 G4:1",
  "A4:2 Bb4:2 A4:2 G4:1 F4:1",
  "D4:8",
  "D4:8",
]

[[part]]
id = "vc"
name = "Cello"
program = 42
staves = 1
range = ["C2", "A5"]
[[part.dynamic]]
