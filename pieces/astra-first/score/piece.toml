# =============================================================================
#  THE SOURCE OF TRUTH. This file is the composition.
#
#  Everything in build/ is generated from this file and is disposable.
#  Edit this only on your turn — see CONTRIBUTING.md for the relay protocol.
#  Run tools/check.sh before every commit.
#
#  NOTE SYNTAX
#    Each entry in a voice's `bars` array is one bar, written as
#    whitespace-separated tokens of the form PITCH:UNITS.
#
#      A4:2          A above middle C, lasting 2 units
#      Bb3:1  F#5:4  flats and sharps
#      r:2           a rest
#      C4,E4,G4:2    a chord (or a string double stop), one duration
#      G4:4~ G4:2    a tie: the '~' joins this note to the next of the
#                    same pitch, here sounding as a single 6-unit G
#
#    One UNIT is `settings.unit` below. Every bar must add up to exactly one
#    bar of `settings.meter`, and every voice must have the same number of
#    bars — pad a silent instrument with rests. tools/check.sh reports both.
# =============================================================================

[meta]
title = "Untitled (Astra first)"
composers = ["GPT-6 Astra", "Fable 5.1"]

[settings]
unit = "eighth"     # one rhythmic unit; use "sixteenth" if you need finer
meter = "4/4"
key = "C"           # controls the key signature and enharmonic spelling
release_seconds = 4 # silence left at the end of the audio for the decay

# Tempo applies to the whole ensemble and changes at bar lines.
[[tempo]]
bar = 1
bpm = 96
beat = "quarter"    # or "dotted-quarter" for compound meters

# The ensemble dynamic. Any part may override it with its own [[part.dynamic]]
# block — balance between the five players is most of the craft here.
[[dynamic]]
bar = 1
mark = "mf"         # ppp pp p mp mf f ff fff

[marks]
1 = "A - Con moto; viola forward, each entry an answer"
4 = "Piano: lightly insistent, without pedal"
9 = "Cello takes the question; others yield"
12 = "Keep the pulse; no cadence"
13 = "F minor; cello sings, piano supports; pedal allowed"
17 = "Cello: augmented"
20 = "Piano: its A-natural, unrepentant"
21 = "No third"
22 = "Violin I: the minor third, sustained; no pedal"
27 = "Close, restrained: piano yields by semitone"
30 = "C minor; let the arrival settle"
32 = "Toward B; no slowing"
33 = "B - Eb major. Piano leads, flowing, with pedal; strings enter one by one, sustained"
41 = "Piano alone: the gesture in Eb, its whole tone now diatonic"

# Turn 01: one twelve-bar opening gesture, passed between players.
# C-G-Ab-G is challenged by the piano's A-natural; bar 12 leaves Ab over G.
# Each numbered line below is one bar. Strings remain single-note lines.
#
# Turn 02: the Ab is held into bar 13 and put over F - a consonance, F minor.
# The cello sings the opening gesture augmented (6-2-4-4) as the first real
# line; the piano supports, then re-states its A-natural in bar 20 against
# the cello's Ab. Bar 21 stops on a bare C over G with no third.

# Turn 03: bars 22-32 complete A. Violin I chooses Eb; the piano gives up
# A-natural in a close-register exchange, then accepts Eb at the cadence.
# Bar 32 offers Bb7 as a doorway to B, without supplying its resolution.
#
# Turn 04: B opens in Eb. The texture inverts: the piano runs in continuous
# eighths for the first time; the strings enter in canon at two bars with the
# gesture augmented (6-2-4-4), singing the whole-tone version because in Eb
# that is the diatonic one. The cello's entry is cut off by the piano, alone
# and f, stating the gesture in Eb and stopping on D over Bb.

